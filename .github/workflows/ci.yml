name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_VERSION: "0.9.151"
  DENY_VERSION: "0.20.2"
  VET_VERSION: "0.10.3"

jobs:
  windows:
    runs-on: windows-latest
    env:
      # libopus is built with CMake; a short target folder keeps its paths under MAX_PATH.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version ${{ env.NEXTEST_VERSION }} --locked
      - name: Tests (interactive and GPU-only tests are ignored by default)
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --profile ci 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Failing tests as annotations
        if: failure()
        shell: python
        env:
          JUNIT: C:/t/nextest/ci/junit.xml
          RERUN_SCOPE: --workspace
        run: |
          import os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          import xml.etree.ElementTree as ET
          def esc(t):
              return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          shown = 0
          junit = os.environ["JUNIT"]
          if os.path.exists(junit):
              for case in ET.parse(junit).getroot().iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is None or shown >= 40:
                      continue
                  shown += 1
                  text = (bad.get("message") or "") + " " + (case.findtext("system-err") or bad.text or "")
                  text = " ".join(text.split())[-900:]
                  title = f"{case.get('classname')} {case.get('name')}".replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={esc(title)}::{esc(text)}")
          if shown == 0:
              # No report: rerun each failing test alone, uncaptured and without colour, and show the end of its output.
              import subprocess
              log = open(os.path.join(os.environ["RUNNER_TEMP"], "tests.log"), encoding="utf-8", errors="replace").read()
              log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]|\x1b\][^\x07]*\x07", "", log)
              lines = log.splitlines()
              failed = []
              for line in lines:
                  m = re.search(r"\bFAIL \[[^]]*\] \([ 0-9/]+\) (\S+) (\S+)\s*$", line)
                  if m and m.groups() not in failed:
                      failed.append(m.groups())
              for binary, name in failed[:6]:
                  expr = f"binary_id({binary}) & test(={name})"
                  run = subprocess.run(
                      ["cargo", "nextest", "run", *os.environ["RERUN_SCOPE"].split(), "--locked", "--profile", "ci",
                       "--retries", "0", "--no-capture", "--color", "never", "-E", expr],
                      capture_output=True, text=True, encoding="utf-8", errors="replace",
                      env={**os.environ, "CARGO_TERM_COLOR": "never", "RUST_BACKTRACE": "0"})
                  out = [l for l in (run.stdout + run.stderr).splitlines() if l.strip()]
                  title = f"{binary} {name}".replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={esc(title)}::{esc(chr(10).join(out[-40:])[-3800:])}")
                  shown += 1
              keep = [l for l in lines if l.strip() and re.search(r"error|FAIL|panicked|SIGSEGV|TIMEOUT", l)][-30:]
              print(f"::error title=no JUnit report::{esc(chr(10).join(keep + lines[-25:])[-3800:])}")

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the macOS crates
        run: >
          cargo check --locked --all-targets
          -p swapdesk-shell-mac -p swapdesk-codec-mac -p swapdesk-render-mac -p swapdesk-input-mac
          -p swapdesk-audio-mac -p swapdesk-net-mac -p swapdesk-secret-mac -p swapdesk-core-mac
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version ${{ env.NEXTEST_VERSION }} --locked
      - name: Tests of the OS-free crates
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --locked --profile ci -p swapdesk-proto -p swapdesk-platform -p swapdesk-keys -p swapdesk-trust -p swapdesk-lan -p swapdesk-session -p swapdesk-video -p swapdesk-audio -p swapdesk-files -p swapdesk-swap -p swapdesk-extras -p swapdesk-host -p swapdesk-ui -p swapdesk-fakes 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Failing tests as annotations
        if: failure()
        shell: python
        env:
          JUNIT: target/nextest/ci/junit.xml
          RERUN_SCOPE: "-p swapdesk-proto -p swapdesk-platform -p swapdesk-keys -p swapdesk-trust -p swapdesk-lan -p swapdesk-session -p swapdesk-video -p swapdesk-audio -p swapdesk-files -p swapdesk-swap -p swapdesk-extras -p swapdesk-host -p swapdesk-ui -p swapdesk-fakes"
        run: |
          import os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          import xml.etree.ElementTree as ET
          def esc(t):
              return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          shown = 0
          junit = os.environ["JUNIT"]
          if os.path.exists(junit):
              for case in ET.parse(junit).getroot().iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is None or shown >= 40:
                      continue
                  shown += 1
                  text = (bad.get("message") or "") + " " + (case.findtext("system-err") or bad.text or "")
                  text = " ".join(text.split())[-900:]
                  title = f"{case.get('classname')} {case.get('name')}".replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={esc(title)}::{esc(text)}")
          if shown == 0:
              # No report: rerun each failing test alone, uncaptured and without colour, and show the end of its output.
              import subprocess
              log = open(os.path.join(os.environ["RUNNER_TEMP"], "tests.log"), encoding="utf-8", errors="replace").read()
              log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]|\x1b\][^\x07]*\x07", "", log)
              lines = log.splitlines()
              failed = []
              for line in lines:
                  m = re.search(r"\bFAIL \[[^]]*\] \([ 0-9/]+\) (\S+) (\S+)\s*$", line)
                  if m and m.groups() not in failed:
                      failed.append(m.groups())
              for binary, name in failed[:6]:
                  expr = f"binary_id({binary}) & test(={name})"
                  run = subprocess.run(
                      ["cargo", "nextest", "run", *os.environ["RERUN_SCOPE"].split(), "--locked", "--profile", "ci",
                       "--retries", "0", "--no-capture", "--color", "never", "-E", expr],
                      capture_output=True, text=True, encoding="utf-8", errors="replace",
                      env={**os.environ, "CARGO_TERM_COLOR": "never", "RUST_BACKTRACE": "0"})
                  out = [l for l in (run.stdout + run.stderr).splitlines() if l.strip()]
                  title = f"{binary} {name}".replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={esc(title)}::{esc(chr(10).join(out[-40:])[-3800:])}")
                  shown += 1
              keep = [l for l in lines if l.strip() and re.search(r"error|FAIL|panicked|SIGSEGV|TIMEOUT", l)][-30:]
              print(f"::error title=no JUnit report::{esc(chr(10).join(keep + lines[-25:])[-3800:])}")

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --version ${{ env.DENY_VERSION }} --locked
      - name: Advisories, licenses, sources, bans
        run: cargo deny --locked check
      - name: Install cargo-vet
        run: cargo install cargo-vet --version ${{ env.VET_VERSION }} --locked
      - name: Every dependency audited or exempted (supply-chain/)
        run: cargo vet --locked
