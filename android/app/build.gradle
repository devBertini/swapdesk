plugins {
    id "com.android.application"
}

// One version for every Swapdesk program: the Rust workspace's.
def workspaceVersion = (rootProject.file("../Cargo.toml").text =~ /(?m)^version = "([^"]+)"/)[0][1]

android {
    namespace = "io.github.devbertini.swapdesk"
    compileSdk = 37

    defaultConfig {
        applicationId = "io.github.devbertini.swapdesk"
        // Android 11 at least, built for Android 17 (docs/ANDROID.md 8.3): from that level the local network
        // is a permission the person grants.
        minSdk = 30
        targetSdk = 37
        versionCode = 1
        versionName = workspaceVersion
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
