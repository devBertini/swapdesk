org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# A build leaves no background process behind on the machine that ran it.
org.gradle.daemon=false
# The app is Java only. The plugin's built-in Kotlin would add the Kotlin standard library to every variant and pack
# about 2 MB of code nothing here calls into the APK: no default dependency on it.
kotlin.stdlib.default.dependency=false
