[package]
name = "swapdesk-measure"
description = "Development tool: measures the session budgets of docs/SPEC.md through the whole chain (helper, service, QUIC on loopback, service, viewer) on the synthetic sources of contract C7. Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Like a platform crate, it holds `unsafe` (the window and composition tree of the viewer stand-in, the process
# counters, the counting allocator). The workspace lints are repeated here without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[[bin]]
name = "swapdesk-measure"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
swapdesk-app = { path = "../swapdesk-app", default-features = false }
swapdesk-audio = { path = "../swapdesk-audio" }
swapdesk-capture-win = { path = "../swapdesk-capture-win" }
swapdesk-codec-win = { path = "../swapdesk-codec-win" }
swapdesk-crossdrive = { path = "../swapdesk-crossdrive" }
swapdesk-fakes = { path = "../swapdesk-fakes" }
swapdesk-host = { path = "../swapdesk-host" }
swapdesk-ipc = { path = "../swapdesk-ipc" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-render-win = { path = "../swapdesk-render-win" }
swapdesk-shell-win = { path = "../swapdesk-shell-win" }
swapdesk-sys-win = { path = "../swapdesk-sys-win" }
swapdesk-trust = { path = "../swapdesk-trust" }
swapdesk-ui = { path = "../swapdesk-ui" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
