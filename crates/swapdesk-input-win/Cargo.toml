[package]
name = "swapdesk-input-win"
description = "Input for Windows (contract C3): InputSink through SendInput and InputGrabber through a WH_KEYBOARD_LL hook."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (SendInput, the keyboard hook, desktop calls). The workspace
# lints are repeated here without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-keys = { path = "../swapdesk-keys" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Tests only: the test window, DPI awareness, the cursor, display geometry and the layout list.
[target.'cfg(windows)'.dev-dependencies]
swapdesk-capture-win = { path = "../swapdesk-capture-win" }
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }
