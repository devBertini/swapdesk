[package]
name = "swapdesk-codec-android"
description = "The Android video path: `AMediaCodec` decoding into the session surface's native window, as `VideoDecoder` and `Renderer` in one (docs/ANDROID.md 5). Compiles to nothing off Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate (`*-android`): it will hold the NDK calls of its lane. The workspace lints are repeated here without
# `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
