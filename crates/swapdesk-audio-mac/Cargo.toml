[package]
name = "swapdesk-audio-mac"
description = "Audio for macOS (contract C3): AudioSink over the default output audio unit (Core Audio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (Core Audio calls). The workspace lints are repeated here
# without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-platform = { path = "../swapdesk-platform" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { workspace = true, features = [
    "std",
    "AUComponent",
    "AudioComponent",
    "AudioOutputUnit",
    "AudioUnitProperties",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
