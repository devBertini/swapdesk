[package]
name = "swapdesk-audio-win"
description = "Audio for Windows (contract C3): AudioSource over WASAPI loopback with process-exclusion loopback, and AudioSink over WASAPI render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (COM and WASAPI calls). The workspace lints are repeated here
# without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-platform = { path = "../swapdesk-platform" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
swapdesk-fakes = { path = "../swapdesk-fakes" }
