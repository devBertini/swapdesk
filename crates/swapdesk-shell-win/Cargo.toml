[package]
name = "swapdesk-shell-win"
description = "Windows shell of Swapdesk: Win32 windows, DirectComposition tree, Direct2D/DirectWrite drawing, AccessKit adapter, native EDIT inputs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: the only `unsafe` of the UI lives here (every other lint stays the workspace's).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-ui = { path = "../swapdesk-ui" }
swapdesk-paint = { path = "../swapdesk-paint" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-termview = { path = "../swapdesk-termview" }
# The bin and the volumes of this computer (`disk`), shared with the user helper.
swapdesk-sys-win = { path = "../swapdesk-sys-win" }
accesskit.workspace = true
accesskit_windows.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # OLE drag and drop with the system's file manager (FILES-UI.md 4.2, 4.3): RegisterDragDrop, IDropTarget,
    # DoDragDrop, IDataObject.
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
]
