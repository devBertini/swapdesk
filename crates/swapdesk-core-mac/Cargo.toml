[package]
name = "swapdesk-core-mac"
description = "Wiring of the macOS app's in-process ServiceCore (D27): the ServiceConfig builder over the keychain secret store and the physical-interface list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No `unsafe` here: every Apple call lives in swapdesk-net-mac and swapdesk-secret-mac.
[lints]
workspace = true

[dependencies]
swapdesk-host = { path = "../swapdesk-host" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-session = { path = "../swapdesk-session" }
swapdesk-trust = { path = "../swapdesk-trust" }

[target.'cfg(target_os = "macos")'.dependencies]
swapdesk-net-mac = { path = "../swapdesk-net-mac" }
swapdesk-secret-mac = { path = "../swapdesk-secret-mac" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Stage 23 cross-machine proof: `examples/cross_viewer`.
swapdesk-codec-mac = { path = "../swapdesk-codec-mac" }
# v1.1 copy and paste proof: `examples/cross_viewer --clip`.
swapdesk-input-mac = { path = "../swapdesk-input-mac" }
# The swap proof: `examples/cross_viewer --swap` announces itself on the LAN (the other side opens the reverse session to it).
swapdesk-lan = { path = "../swapdesk-lan" }

[dev-dependencies]
swapdesk-audio = { path = "../swapdesk-audio" }
swapdesk-crossdrive = { path = "../swapdesk-crossdrive" }
swapdesk-ui = { path = "../swapdesk-ui" }
swapdesk-fakes = { path = "../swapdesk-fakes" }
swapdesk-ipc = { path = "../swapdesk-ipc" }
tokio.workspace = true
