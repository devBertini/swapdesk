[package]
name = "swapdesk-net-mac"
description = "NetInterfaces for macOS (contract C3): getifaddrs plus SystemConfiguration, so only physical Wi-Fi and Ethernet interfaces are approved."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (libc and CoreFoundation calls). The workspace lints are repeated
# here without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-platform = { path = "../swapdesk-platform" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFString"] }
objc2-system-configuration = { workspace = true, features = ["std", "SCNetworkConfiguration"] }
