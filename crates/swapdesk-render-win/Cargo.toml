[package]
name = "swapdesk-render-win"
description = "Renderer for Windows (contract C3): decoded NV12 textures through the D3D11 video processor into a composition swap chain set as the content of the shell's DirectComposition video visual."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (COM, D3D11, DXGI and DirectComposition calls). The workspace
# lints are repeated here without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-platform = { path = "../swapdesk-platform" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

# Tests and the measurement example: the whole pipeline (synthetic screen, encoder, decoder, renderer) in a window of
# their own, and the process counters.
[target.'cfg(windows)'.dev-dependencies]
swapdesk-codec-win = { path = "../swapdesk-codec-win" }
swapdesk-fakes = { path = "../swapdesk-fakes" }
swapdesk-proto = { path = "../swapdesk-proto" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
