[package]
name = "swapdesk-input-mac"
description = "Viewer input for macOS (contract C3): the ViewerInput of the video view and the InputGrabber over a CGEventTap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate: it holds the `unsafe` of this feature (CGEventTap, TCC checks). The workspace lints are repeated here
# without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-keys = { path = "../swapdesk-keys" }
swapdesk-shell-mac = { path = "../swapdesk-shell-mac" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["std", "CFBase", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
