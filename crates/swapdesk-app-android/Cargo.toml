[package]
name = "swapdesk-app-android"
description = "The Android app's shared library: the JNI entry points over the service core, the backend and the viewer pipeline (docs/ANDROID.md 5). The service assembly builds on every host; the JNI side on Android only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate (`*-android`): a JNI entry point is an exported, unmangled function, which Rust marks `unsafe`. The
# workspace lints are repeated here without `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# `libswapdesk_android.so` is what the app loads (`System.loadLibrary("swapdesk_android")`); the `rlib` lets the desktop
# gate build and lint this crate like any other. Not named `swapdesk`: on Windows that library's files would collide
# with `Swapdesk.exe`'s in a shared target folder.
[lib]
name = "swapdesk_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
swapdesk-host = { path = "../swapdesk-host" }
swapdesk-ipc = { path = "../swapdesk-ipc" }
swapdesk-lan = { path = "../swapdesk-lan" }
swapdesk-paint = { path = "../swapdesk-paint" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-session = { path = "../swapdesk-session" }
swapdesk-shell-android = { path = "../swapdesk-shell-android" }
swapdesk-sys-android = { path = "../swapdesk-sys-android" }
swapdesk-trust = { path = "../swapdesk-trust" }
swapdesk-ui = { path = "../swapdesk-ui" }
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
swapdesk-audio = { path = "../swapdesk-audio" }
# Only with the `dev-harness` feature: the scripted viewer.
swapdesk-crossdrive = { path = "../swapdesk-crossdrive", optional = true }

[features]
# Development builds only (scripts/android/build-core.sh without --release): the self-test, the reachability probe
# and the scripted viewer that pairs and connects with no human touch, with the development options of `Core.start`
# (QUIC TTL for the emulator, loopback peers). A release library is built without it and checked for its symbols.
dev-harness = ["dep:swapdesk-crossdrive"]

[dev-dependencies]
swapdesk-crossdrive = { path = "../swapdesk-crossdrive" }
swapdesk-fakes = { path = "../swapdesk-fakes" }
