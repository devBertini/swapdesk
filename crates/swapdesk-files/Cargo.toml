[package]
name = "swapdesk-files"
description = "File transfers of Swapdesk: offers, resume from the verified length, SHA-256 check, safe receiving and remote folder listing (PROTOCOL.md 5.3, SPEC F-FILE-01 and F-FILE-02)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
swapdesk-ipc = { path = "../swapdesk-ipc" }
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-session = { path = "../swapdesk-session" }
quinn.workspace = true
ring.workspace = true
tokio.workspace = true

[dev-dependencies]
swapdesk-fakes = { path = "../swapdesk-fakes" }
swapdesk-netsim = { path = "../swapdesk-netsim" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-trust = { path = "../swapdesk-trust" }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

# The calls `std` lacks (a rename and a copy that never replace, the mark of a downloaded file): the glue crates of the
# two systems, which hold the `unsafe` this crate forbids. Workspace crates, not third-party ones.
[target.'cfg(windows)'.dependencies]
swapdesk-sys-win = { path = "../swapdesk-sys-win" }

[target.'cfg(target_os = "macos")'.dependencies]
swapdesk-sys-mac = { path = "../swapdesk-sys-mac" }
