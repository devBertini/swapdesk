[package]
name = "swapdesk-audio-android"
description = "The Android `AudioSink` on AAudio (docs/ANDROID.md 5). Compiles to nothing off Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Platform crate (`*-android`): it will hold the NDK calls of its lane. The workspace lints are repeated here without
# `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
