[package]
name = "swapdesk-service"
description = "swapdesk-service.exe: the LocalSystem service (or `--console` development process) that owns the LAN, the trust store, the helpers and the UI pipe (C2.1, C2.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "swapdesk-service"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
swapdesk-host = { path = "../swapdesk-host" }
swapdesk-update = { path = "../swapdesk-update" }
swapdesk-ipc = { path = "../swapdesk-ipc" }
swapdesk-platform = { path = "../swapdesk-platform" }
swapdesk-proto = { path = "../swapdesk-proto" }
swapdesk-trust = { path = "../swapdesk-trust" }
swapdesk-lan = { path = "../swapdesk-lan" }
swapdesk-sys-win = { path = "../swapdesk-sys-win" }
swapdesk-secret-win = { path = "../swapdesk-secret-win" }
swapdesk-net-win = { path = "../swapdesk-net-win" }
# Only for `QpcClock`, the machine clock of C3 that the helpers stamp their frames with.
swapdesk-capture-win = { path = "../swapdesk-capture-win" }

# The M3 gate (tests/gate_m3.rs) decodes what the viewer receives and parses its audio; the pointer is read through a
# PowerShell helper because this crate forbids `unsafe`.
[target.'cfg(windows)'.dev-dependencies]
swapdesk-codec-win = { path = "../swapdesk-codec-win" }
swapdesk-audio = { path = "../swapdesk-audio" }
