<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visualizador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
.sd{--canvas:#EEF0F3;--surface:#FFFFFF;--sunken:#F6F7F9;--ink:#171A21;--soft:#575E6B;--line:#DFE2E8;--link:#3346D3;--link-ink:#FFFFFF;--link-tint:#E8EBFC;--ok:#1C7C54;--danger:#BF3328;--danger-tint:#FBE9E7;--remote:#2A2F3A;font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
.sd.dark{--canvas:#14161B;--surface:#1C1F26;--sunken:#181B21;--ink:#E9EBF0;--soft:#A0A7B4;--line:#2D323C;--link:#8C9BFF;--link-ink:#10142E;--link-tint:#272D55;--ok:#4FC28E;--danger:#FF7A6E;--danger-tint:#3A1F1D;--remote:#0C0E12}
.sd,.sd *{box-sizing:border-box}
.sd button{font:inherit;cursor:pointer}
.sd p{margin:0}
.sd .soft{color:var(--soft)}
.sd .tb{display:flex;align-items:center;gap:2px;padding:6px;border-radius:12px;background:rgba(23,26,33,0.94);box-shadow:0 10px 30px rgba(0,0,0,0.35);color:#E9EBF0}
.sd .tb button{height:40px;min-width:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#E9EBF0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500}
.sd .tb button[aria-pressed="true"]{background:rgba(140,155,255,0.22);color:#FFFFFF}
.sd .tb button:focus-visible{outline:2px solid #8C9BFF;outline-offset:1px}
.sd .tb .sep{width:1px;height:24px;background:rgba(255,255,255,0.16);margin:0 6px}
a{color:#3346D3}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1200px; height: 760px; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid var(--line)">
  <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ok)"></span>
    <span style="font-weight: 600">MacBook do escritório</span>
    <span class="soft">você controla há 12 min</span>
    <span style="flex: 1"></span>
    <span class="soft" style="font-size: 13px; font-variant-numeric: tabular-nums">18 ms, 60 qps</span>
  </div>

  <div style="flex: 1; min-height: 0; position: relative; background: var(--remote); display: flex; align-items: center; justify-content: center">
    <div aria-label="Tela do MacBook" style="width: 1104px; height: 690px; position: relative; overflow: hidden; border-radius: 4px; background: #46586A">
      <div style="height: 26px; padding: 0 14px; display: flex; align-items: center; gap: 18px; background: rgba(246,247,249,0.9); color: #171A21; font-size: 12px"><span style="font-weight: 700">Finder</span><span>Arquivo</span><span>Editar</span><span>Visualizar</span><span style="flex: 1"></span><span>sáb. 15:20</span></div>
      <div style="position: absolute; left: 96px; top: 120px; width: 560px; height: 360px; border-radius: 10px; overflow: hidden; background: #F6F7F9; box-shadow: 0 20px 50px rgba(0,0,0,0.35)">
        <div style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #E9EBEF"><span style="width: 12px; height: 12px; border-radius: 50%; background: #E0605A"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #E0B44C"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #5CB565"></span><span style="margin-left: 10px; font-size: 13px; font-weight: 600; color: #171A21">Projetos</span></div>
        <div style="padding: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px">
          <div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div><div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div><div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div><div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div><div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div><div style="height: 76px; border-radius: 8px; background: #D9E1EA"></div>
        </div>
      </div>
      <div style="position: absolute; left: 600px; top: 270px; width: 420px; height: 270px; border-radius: 10px; overflow: hidden; background: #1A1E24; box-shadow: 0 20px 50px rgba(0,0,0,0.4); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D6DAE0">
        <div style="height: 30px; display: flex; align-items: center; padding: 0 12px; background: #262B33; color: #A0A7B4">Terminal</div>
        <p style="padding: 12px; line-height: 1.7; white-space: pre-line">claudio@MacBook ~ % swift build
Build complete! (4.21s)
claudio@MacBook ~ %</p>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 470px; top: 210px"><path d="M5 3l14 8-6 1.5L10 19z" fill="#FFFFFF" stroke="#171A21" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </div>

    <div role="toolbar" aria-label="Sessão" class="tb" style="position: absolute; top: 14px; left: 50%; transform: translateX(-50%)">
      <button aria-label="Escolher tela">Tela 1<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button aria-label="Ajustar à janela"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
      <span class="sep"></span>
      <button aria-label="Áudio" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></button>
      <button aria-label="Capturar atalhos do sistema" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg></button>
      <button aria-label="Enviar Ctrl+Alt+Del e outras teclas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      <span class="sep"></span>
      <button aria-label="Terminal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9l3 3-3 3M12 15h5"></path></svg></button>
      <button aria-label="Arquivos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
      <button aria-label="Chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
      <span class="sep"></span>
      <button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C9BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>Inverter</button>
      <button style="color: #FF8A80; font-weight: 600">Desconectar</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'claro') === 'escuro';
    return { themeClass: dark ? 'sd dark' : 'sd' };
  }
}
</script>
</body>
</html>
