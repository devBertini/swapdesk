<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sendo controlado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
.sd{--canvas:#EEF0F3;--surface:#FFFFFF;--sunken:#F6F7F9;--ink:#171A21;--soft:#575E6B;--line:#DFE2E8;--link:#3346D3;--link-ink:#FFFFFF;--link-tint:#E8EBFC;--ok:#1C7C54;--danger:#BF3328;--danger-tint:#FBE9E7;--remote:#2A2F3A;font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
.sd.dark{--canvas:#14161B;--surface:#1C1F26;--sunken:#181B21;--ink:#E9EBF0;--soft:#A0A7B4;--line:#2D323C;--link:#8C9BFF;--link-ink:#10142E;--link-tint:#272D55;--ok:#4FC28E;--danger:#FF7A6E;--danger-tint:#3A1F1D;--remote:#0C0E12}
.sd,.sd *{box-sizing:border-box}
.sd button{font:inherit;cursor:pointer}
.sd p{margin:0}
.sd .soft{color:var(--soft)}
.sd .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.sd .btn.danger{background:var(--danger);border-color:var(--danger);color:#FFFFFF;font-weight:600}
.sd .btn.icon{width:36px;padding:0}
.sd .btn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
a{color:#3346D3}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1200px; height: 760px; position: relative; overflow: hidden; border-radius: 12px; background: #3A5566">
  <div role="status" aria-label="Sessão ativa" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 2px var(--link), 0 14px 40px rgba(0,0,0,0.35)">
    <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--link)"></span>
    <p><span style="font-weight: 600">MacBook do escritório controla este computador</span> <span class="soft">há 12 min</span></p>
    <button class="btn icon" aria-label="Abrir chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
    <button class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--link)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>Inverter</button>
    <button class="btn danger">Desconectar</button>
  </div>

  <div style="position: absolute; left: 150px; top: 150px; width: 620px; height: 390px; border-radius: 8px; overflow: hidden; background: #F3F4F6; box-shadow: 0 20px 50px rgba(0,0,0,0.35)">
    <div style="height: 34px; display: flex; align-items: center; padding: 0 14px; background: #E5E7EB; font-size: 12px; color: #171A21">Explorador de Arquivos</div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 20px; width: 70%; border-radius: 4px; background: #D6DAE0"></div>
      <div style="height: 20px; width: 52%; border-radius: 4px; background: #D6DAE0"></div>
      <div style="height: 20px; width: 61%; border-radius: 4px; background: #D6DAE0"></div>
    </div>
  </div>
  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 560px; top: 330px"><path d="M5 3l14 8-6 1.5L10 19z" fill="#FFFFFF" stroke="#171A21" stroke-width="1.4" stroke-linejoin="round"></path></svg>
  <span style="position: absolute; left: 582px; top: 350px; padding: 2px 8px; border-radius: 6px; background: var(--link); color: var(--link-ink); font-size: 12px; font-weight: 600">MacBook</span>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(23,26,33,0.9)">
    <span style="width: 30px; height: 30px; border-radius: 6px; background: rgba(255,255,255,0.16)"></span>
    <span style="width: 30px; height: 30px; border-radius: 6px; background: rgba(255,255,255,0.16)"></span>
    <span style="width: 30px; height: 30px; border-radius: 6px; background: rgba(255,255,255,0.16)"></span>
    <span aria-label="Swapdesk em uso" style="width: 30px; height: 30px; border-radius: 6px; background: #3346D3; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="8" height="12" rx="2"></rect><rect x="13.5" y="6" width="8" height="12" rx="2"></rect><path d="M10.5 12h3"></path></svg></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'claro') === 'escuro';
    return { themeClass: dark ? 'sd dark' : 'sd' };
  }
}
</script>
</body>
</html>
